<style>
html{scroll-behavior:smooth}
body{margin:0;background:#F4EEE6;color:#2E2724;font-family:'Jost',system-ui,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#8C4A52}a:hover{color:#6E3840}
.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400}
.hand{font-family:'Caveat',cursive;font-weight:600}
em{font-style:italic;color:#8C4A52}
.dark em{color:#D8C2A3}
.eyebrow{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:#6F655C;font-weight:400}
.dark .eyebrow{color:#CDBFB4}
.lineeye{display:flex;align-items:center;gap:14px}
.lineeye::before{content:"";width:40px;height:1px;background:currentColor;opacity:.6}
.h2{margin:0;font-size:clamp(40px,7vw,64px);line-height:1.04}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.dark{background:radial-gradient(120% 80% at 50% 0%,#4A3034 0%,#3A2629 45%,#2A1B1E 100%);color:#F4EEE6}

/* loader curtain */
.curtain{position:fixed;inset:0;z-index:200;background:radial-gradient(90% 60% at 50% 40%,#4A3034,#2A1B1E);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;border-radius:0 0 50% 50%/0 0 0 0;animation:lift 1s cubic-bezier(.76,0,.24,1) 2.7s forwards}
.curtain img{width:120px;height:120px;border-radius:50%;opacity:0;animation:fadeUp 1s ease .15s forwards;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.curtain .word{font-size:clamp(34px,9vw,52px);color:#F4EEE6;opacity:0;animation:fadeUp 1s ease .55s forwards}
.curtain .rule{width:0;height:1px;background:#D8C2A3;animation:grow 1.3s cubic-bezier(.65,0,.35,1) .9s forwards}
.curtain .tag{font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:#D8C2A3;opacity:0;animation:fadeUp 1s ease 1.35s forwards}
.curtain .inner{display:flex;flex-direction:column;align-items:center;gap:18px;animation:fadeOut .5s ease 2.35s forwards}
@keyframes lift{0%{transform:translateY(0);border-radius:0}100%{transform:translateY(-105%);border-radius:0 0 50% 50%/0 0 22% 22%;visibility:hidden}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeOut{to{opacity:0;transform:translateY(-10px)}}
@keyframes grow{to{width:180px}}
.enter{opacity:0;animation:fadeUp 1.1s cubic-bezier(.2,.7,.2,1) forwards}
.e1{animation-delay:3.15s}.e2{animation-delay:3.3s}.e3{animation-delay:3.45s}.e4{animation-delay:3.6s}.e5{animation-delay:3.75s}

/* scroll driven */
.progress{position:fixed;top:0;left:0;right:0;height:2px;background:#8C4A52;transform-origin:0 50%;transform:scaleX(0);z-index:60}
@supports (animation-timeline: view()){
.reveal{animation:fadeUp linear both;animation-timeline:view();animation-range:entry 0% cover 25%}
.progress{animation:prog linear both;animation-timeline:scroll(root)}
}
@keyframes prog{to{transform:scaleX(1)}}

/* nav */
.nav{position:sticky;top:0;z-index:50;background:rgba(244,238,230,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(46,39,36,.08)}
.navin{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.navlinks{display:flex;gap:28px;align-items:center}
.navlinks a.l{color:#2E2724;text-decoration:none;font-size:14px;letter-spacing:.06em}
.navlinks a.l:hover{color:#8C4A52}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 26px;border-radius:999px;background:#8C4A52;color:#FAF6F0;text-decoration:none;font-size:12px;letter-spacing:.24em;text-transform:uppercase;border:1px solid #8C4A52;cursor:pointer;font-family:inherit;font-weight:400;transition:transform .35s cubic-bezier(.2,.7,.2,1),background .35s ease,box-shadow .35s ease;box-shadow:0 10px 24px rgba(140,74,82,.22)}
.btn:hover{background:#6E3840;color:#FAF6F0;transform:translateY(-2px);box-shadow:0 14px 30px rgba(140,74,82,.3)}
.btn .dot{width:6px;height:6px;border-radius:50%;background:#FAF6F0;display:inline-block}
.ghost{background:transparent;color:#2E2724;border-color:rgba(46,39,36,.4);box-shadow:none}
.ghost:hover{background:#2E2724;color:#F4EEE6;box-shadow:none}
.dark .ghost{color:#F4EEE6;border-color:rgba(244,238,230,.45)}
.dark .ghost:hover{background:#F4EEE6;color:#2A1B1E}

/* hero */
.hero{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:56px;align-items:center;padding:56px 0 72px;position:relative}
.ring{position:absolute;width:560px;height:560px;border-radius:50%;border:1px solid rgba(140,74,82,.18);left:-180px;top:40px;pointer-events:none}
.archwrap{position:relative;max-width:460px;margin-left:auto;width:100%}
.arch{width:100%;aspect-ratio:4/5.2;object-fit:cover;border-radius:999px 999px 18px 18px;display:block;box-shadow:0 30px 60px rgba(46,39,36,.18)}
.archframe{position:absolute;inset:-12px;border:1px solid rgba(140,74,82,.25);border-radius:999px 999px 26px 26px;pointer-events:none}
.badge{position:absolute;left:-34px;top:70px;width:132px;height:132px}
.badge svg{width:100%;height:100%;animation:spin 22s linear infinite}
.badge .core{position:absolute;inset:38px;border-radius:50%;background:#8C4A52}
@keyframes spin{to{transform:rotate(360deg)}}
.note{position:absolute;right:-14px;bottom:44px;background:#FBF8F3;padding:16px 22px 14px;transform:rotate(-4deg);box-shadow:0 18px 40px rgba(46,39,36,.18);display:flex;flex-direction:column;gap:4px;animation:bob 6s ease-in-out infinite}
.note::before{content:"";position:absolute;top:-10px;left:50%;width:58px;height:20px;margin-left:-29px;background:rgba(216,194,163,.55);transform:rotate(3deg)}
@keyframes bob{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(-3deg) translateY(-6px)}}
.strip{display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#6F655C}
.strip .star{color:#8C4A52}
.mouse{width:22px;height:36px;border:1px solid rgba(46,39,36,.4);border-radius:12px;position:relative;margin:0 auto}
.mouse::after{content:"";position:absolute;left:50%;top:7px;width:2px;height:7px;margin-left:-1px;border-radius:2px;background:#2E2724;animation:wheel 1.8s ease-in-out infinite}
@keyframes wheel{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(10px)}}

/* marquee */
.ribbon{background:#3A2629;color:#F4EEE6;overflow:hidden;padding:26px 0}
.track{display:flex;width:max-content;animation:marq 34s linear infinite}
.track span{display:inline-flex;align-items:center;gap:34px;padding-right:34px;font-size:clamp(26px,4.4vw,38px);font-style:italic;white-space:nowrap}
.track svg{width:18px;height:18px;color:#D8C2A3}
@keyframes marq{to{transform:translateX(-50%)}}

/* image strip */
.pair{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:20px;align-items:end}
.pair img{width:100%;display:block;object-fit:cover;border-radius:18px}
.inset{position:absolute;right:-18px;bottom:-30px;width:44%;aspect-ratio:1/1;border-radius:50%;object-fit:cover;border:6px solid #F4EEE6;box-shadow:0 20px 40px rgba(46,39,36,.2)}

/* tabs and cards */
.tabs{display:inline-flex;padding:6px;border-radius:999px;border:1px solid rgba(244,238,230,.18);gap:4px;flex-wrap:wrap}
.tab{min-height:46px;padding:0 22px;border-radius:999px;background:transparent;border:none;color:#CDBFB4;font-family:inherit;font-size:12px;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;transition:background .4s ease,color .4s ease}
.tab.on{background:#E9DDD3;color:#2A1B1E}
.menu{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:start}
.menuimg{width:100%;aspect-ratio:5/4;object-fit:cover;border-radius:18px;display:block;animation:fadeUp .7s ease both}
.mcard{border:1px solid rgba(244,238,230,.14);border-radius:18px;overflow:hidden;animation:fadeUp .6s ease both}
.mrow{padding:26px 28px;border-top:1px solid rgba(244,238,230,.12);display:flex;flex-direction:column;gap:10px;transition:background .4s ease}
.mrow:first-child{border-top:none}
.mrow:hover{background:rgba(244,238,230,.04)}
.mtop{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.24em;color:#CDBFB4;text-transform:uppercase}

/* steps */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.step{background:#FAF6F0;border:1px solid rgba(46,39,36,.08);border-radius:22px;padding:40px 32px;display:flex;flex-direction:column;gap:14px;transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s ease}
.step:hover{transform:translateY(-6px);box-shadow:0 24px 50px rgba(46,39,36,.1)}

/* packages */
.packs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:stretch}
.pack{background:#FAF6F0;border:1px solid rgba(46,39,36,.1);border-radius:22px;padding:36px 30px;display:flex;flex-direction:column;gap:20px;position:relative}
.pack.feat{background:#3A2629;color:#F4EEE6;border-color:#3A2629}
.pack ul{list-style:none;margin:0;padding:18px 0 0;border-top:1px solid rgba(46,39,36,.12);display:flex;flex-direction:column;gap:12px;color:#6F655C;flex-grow:1}
.pack.feat ul{color:#CDBFB4;border-color:rgba(244,238,230,.16)}
.flag{position:absolute;top:-13px;right:26px;background:#D8C2A3;color:#2A1B1E;font-size:10px;letter-spacing:.24em;text-transform:uppercase;padding:6px 14px;border-radius:999px;font-weight:500}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.gi{position:relative;overflow:hidden;border-radius:18px}
.gi img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}
.gi:hover img{transform:scale(1.05)}
.gi span{position:absolute;left:20px;bottom:16px;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#FAF6F0;text-shadow:0 1px 10px rgba(0,0,0,.45)}

/* booking */
.book{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.cal{background:#E9DDD3;color:#2E2724;border-radius:24px;padding:28px}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.round{width:44px;height:44px;border-radius:50%;border:1px solid rgba(46,39,36,.25);background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#2E2724;font-family:inherit;font-size:18px}
.round:disabled{opacity:.3;cursor:default}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.wd{font-size:10px;letter-spacing:.2em;color:#6F655C;padding:6px 0}
.day{aspect-ratio:1/1;min-height:40px;border-radius:50%;border:none;background:transparent;font-family:inherit;font-size:15px;color:#2E2724;cursor:pointer;transition:background .25s ease,color .25s ease}
.day:hover{background:rgba(140,74,82,.12)}
.day.sel{background:#8C4A52;color:#FAF6F0}
.day.off{color:rgba(46,39,36,.3);text-decoration:line-through;cursor:default;background:transparent}
.day.blank{visibility:hidden}
.legend{display:flex;gap:18px;font-size:12px;color:#6F655C;margin-top:16px;padding-top:16px;border-top:1px solid rgba(46,39,36,.12);flex-wrap:wrap}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:middle}
.form{border:1px solid rgba(244,238,230,.16);border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:18px}
.picked{display:flex;align-items:center;gap:12px;border:1px solid rgba(244,238,230,.18);border-radius:12px;padding:14px 16px;font-size:14px;color:#E9DDD3}
.picked i{width:7px;height:7px;border-radius:2px;background:#D8C2A3;display:inline-block}
.f{display:flex;flex-direction:column;gap:8px}
.f label,.flab{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#CDBFB4}
.f input,.f textarea{font:inherit;font-size:16px;font-weight:300;color:#F4EEE6;background:rgba(244,238,230,.05);border:1px solid rgba(244,238,230,.18);border-radius:12px;padding:14px 16px;min-height:50px;outline:none;transition:border-color .25s ease,background .25s ease}
.f input::placeholder,.f textarea::placeholder{color:rgba(244,238,230,.45)}
.f input:focus,.f textarea:focus{border-color:#D8C2A3;background:rgba(244,238,230,.08)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid rgba(244,238,230,.25);background:transparent;color:#E9DDD3;font-family:inherit;font-size:14px;cursor:pointer;transition:all .25s ease}
.chip.on{background:#E9DDD3;color:#2A1B1E;border-color:#E9DDD3}
.stepper{display:flex;align-items:center;gap:16px}
.stepper .round{color:#F4EEE6;border-color:rgba(244,238,230,.3)}
.err{color:#F2B8B5;font-size:14px}
.light{background:#E9DDD3;color:#2A1B1E;border-color:#E9DDD3;box-shadow:none}
.light:hover{background:#FAF6F0;color:#2A1B1E}

/* faq */
.qa{border-top:1px solid rgba(46,39,36,.14)}
.qbtn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:26px 0;background:transparent;border:none;cursor:pointer;text-align:left;color:#2E2724;font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(22px,3.4vw,28px)}
.plus{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid rgba(46,39,36,.25);display:inline-flex;align-items:center;justify-content:center;font-family:'Jost',sans-serif;font-size:18px;transition:transform .4s ease,background .4s ease}
.plus.open{transform:rotate(45deg);background:#8C4A52;color:#FAF6F0;border-color:#8C4A52}
.ans{margin:0 0 26px;color:#6F655C;line-height:1.75;max-width:640px;animation:fadeUp .5s ease both}

.foot a{color:#F4EEE6;text-decoration:none}
.foot a:hover{color:#D8C2A3}

@media (max-width:860px){
.hero,.menu,.book{grid-template-columns:minmax(0,1fr);gap:40px}
.hero{padding-top:36px}
.archwrap{margin:0 auto;max-width:400px}
.badge{left:-14px;top:40px;width:108px;height:108px}
.badge .core{inset:31px}
.note{right:-4px}
.steps,.packs,.two{grid-template-columns:minmax(0,1fr)}
.gal{grid-template-columns:repeat(2,minmax(0,1fr))}
.navlinks a.l{display:none}
.pair{grid-template-columns:minmax(0,1fr)}
.ring{width:420px;height:420px;left:-200px}
}
@media (prefers-reduced-motion:reduce){
.curtain{animation-duration:.01s;animation-delay:.4s}
.enter{animation:none;opacity:1}
.reveal,.progress{animation:none}
.track,.badge svg,.note{animation:none}
html{scroll-behavior:auto}
}
</style>

        <div class="eyebrow reveal">Our story</div>
        <h2 class="h2 serif reveal">A little room with <em>big</em> blooms.</h2>
        <p class="reveal" style="margin: 0; font-size: 17px; line-height: 1.85; color: #6F655C">The Little Bloom Room began with a simple belief: your flowers should feel like you. Every bouquet starts with a conversation about your outfit, your colours and the flowers you love, then comes together by hand in our East London studio.</p>
        <p class="reveal" style="margin: 0; font-size: 17px; line-height: 1.85; color: #6F655C">We keep our diary small on purpose, so each bride gets our full attention, right down to the ribbon carrying your names and your date.</p>
        <div class="hand reveal" style="font-size: 36px; color: #8C4A52; line-height: 1.2">made by hand, with love</div>
      </div>
    </section>

    <section id="book" class="dark" style="margin-top: 130px; padding: 110px 0 120px">
      <div class="wrap" style="display: flex; flex-direction: column; gap: 44px">
        <div style="display: flex; flex-direction: column; gap: 22px">
          <div class="eyebrow reveal">Book a consultation</div>
          <h2 class="h2 serif reveal">Claim your <em>date.</em></h2>
          <p class="reveal" style="margin: 0; color: #CDBFB4; line-height: 1.8; max-width: 520px">Choose your wedding date, share a few details and we will be in touch to arrange your consultation.</p>
        </div>

        <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
          <div class="book">
            <div class="cal reveal">
              <div class="calhead">
                <button class="round" type="button" aria-label="Previous month" disabled="{{ prevOff }}" onClick="{{ prev }}">‹</button>
                <div class="serif" style="font-size: 26px">{{ monthLabel }}</div>
                <button class="round" type="button" aria-label="Next month" onClick="{{ next }}">›</button>
              </div>
              <div class="grid7">
                <sc-for list="{{ weekdays }}" as="w" hint-placeholder-count="7"><div class="wd">{{ w }}</div></sc-for>
                <sc-for list="{{ days }}" as="d" hint-placeholder-count="35">
                  <button class="{{ d.cls }}" type="button" disabled="{{ d.off }}" aria-label="{{ d.aria }}" onClick="{{ d.pick }}">{{ d.label }}</button>
                </sc-for>
              </div>
              <div class="legend">
                <span><i style="background: #2E2724"></i>Available</span>
                <span><i style="background: #8C4A52"></i>Selected</span>
                <span><i style="background: rgba(46,39,36,.3)"></i>Unavailable</span>
              </div>
            </div>

            <form class="form reveal" onSubmit="{{ submit }}" novalidate="novalidate">
              <div class="picked"><i></i>{{ pickedLabel }}</div>
              <div class="two">
                <div class="f"><label for="bk-name">Name</label><input id="bk-name" name="name" type="text" placeholder="Your full name" autocomplete="name"></div>
                <div class="f"><label for="bk-email">Email</label><input id="bk-email" name="email" type="email" placeholder="you@email.com" autocomplete="email"></div>
              </div>
              <div class="two">
                <div class="f"><label for="bk-phone">Phone</label><input id="bk-phone" name="phone" type="tel" placeholder="Your number" autocomplete="tel"></div>
                <div class="f"><label for="bk-venue">Venue or area</label><input id="bk-venue" name="venue" type="text" placeholder="Where is the wedding"></div>
              </div>
              <div class="f">
                <span class="flab">Looking for</span>
                <div class="chips">
                  <sc-for list="{{ wants }}" as="c" hint-placeholder-count="5">
                    <button class="{{ c.cls }}" type="button" aria-pressed="{{ c.on }}" onClick="{{ c.pick }}">{{ c.label }}</button>
                  </sc-for>
                </div>
              </div>
              <div class="two">
                <div class="f">
                  <span class="flab">Bridesmaids</span>
                  <div class="stepper">
                    <button class="round" type="button" aria-label="Fewer bridesmaids" onClick="{{ less }}">−</button>
                    <span class="serif" style="font-size: 30px; min-width: 28px; text-align: center">{{ maids }}</span>
                    <button class="round" type="button" aria-label="More bridesmaids" onClick="{{ more }}">+</button>
                  </div>
                </div>
                <div class="f">
                  <span class="flab">On the day</span>
                  <div class="chips">
                    <sc-for list="{{ handover }}" as="h" hint-placeholder-count="2">
                      <button class="{{ h.cls }}" type="button" aria-pressed="{{ h.on }}" onClick="{{ h.pick }}">{{ h.label }}</button>
                    </sc-for>
                  </div>
                </div>
              </div>
              <div class="f"><label for="bk-msg">Colours, outfit, flowers you love</label><textarea id="bk-msg" name="message" rows="4" placeholder="Tell us about your day" style="resize: vertical"></textarea></div>
              <sc-if value="{{ error }}" hint-placeholder-val="{{ false }}"><div class="err" role="alert">{{ error }}</div></sc-if>
              <button class="btn light" type="submit" style="align-self: flex-start">Request my consultation</button>
            </form>
          </div>
        </sc-if>

        <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
          <div style="border: 1px solid rgba(244,238,230,.16); border-radius: 24px; padding: 64px 28px; text-align: center; display: flex; flex-direction: column; gap: 18px; align-items: center; animation: fadeUp .7s ease both">
            <div class="serif" style="font-size: clamp(44px, 8vw, 64px)">Thank you, <em>{{ firstName }}.</em></div>
            <p style="margin: 0; color: #CDBFB4; line-height: 1.8; max-width: 440px">Your request for {{ pickedLabel }} is in. We will be in touch soon to arrange your consultation.</p>
            <button class="btn ghost" type="button" onClick="{{ reset }}">Start another</button>
          </div>
        </sc-if>
      </div>
    </section>

    var ALT = { bride: 'White calla lily bridal bouquet', party: 'Blush rose bouquet with eucalyptus', details: 'Bouquet with personalised names ribbon' };
    var MENU = {
      bride: [
        { no: '01', tag: 'Signature', name: 'Cascading Callas', desc: 'White calla lilies with soft astilbe and roses, finished with a flowing ribbon.' },
        { no: '02', tag: 'House favourite', name: 'Calla and Rose', desc: 'A rounded bouquet of white roses and callas, classic and timeless.' },
        { no: '03', tag: 'Statement', name: 'Wine Callas', desc: 'Deep red callas with dried accents, made for rich colour palettes.' },
        { no: '04', tag: 'Custom', name: 'Your Bouquet', desc: 'Designed from scratch around your outfit and the flowers you love.' }
      ],
      party: [
        { no: '01', tag: 'Bridesmaids', name: 'Matching Posies', desc: 'Smaller bouquets that echo the bride, tied in the same ribbon.' },
        { no: '02', tag: 'Bridesmaids', name: 'Blush and Eucalyptus', desc: 'Soft blush roses and textured greenery in a relaxed shape.' },
        { no: '03', tag: 'Custom', name: 'Your Palette', desc: 'Matching or contrasting tones chosen to suit every outfit.' }
      ],
      details: [
        { no: '01', tag: 'Details', name: 'Buttonholes', desc: 'Made from the same stems as your bouquet for the groom and family.' },
        { no: '02', tag: 'Details', name: 'Corsages', desc: 'Wrist and pin corsages for mothers, sisters and guests of honour.' },
        { no: '03', tag: 'Keepsake', name: 'Names Ribbon', desc: 'Your names and wedding date written on the ribbon of your bouquet.' }
      ]
    };
    var TABS = [['bride','The bride'],['party','Bridal party'],['details','Details']];
    var tabs = TABS.map(function (t) { var on = s.tab === t[0]; return { label: t[1], on: on, cls: on ? 'tab on' : 'tab', pick: function () { self.setState({ tab: t[0] }); } }; });

    var today = new Date(); today.setHours(0,0,0,0);
    var first = new Date(s.y, s.m, 1);
    var count = new Date(s.y, s.m + 1, 0).getDate();
    var days = [];
    for (var b = 0; b < first.getDay(); b++) days.push({ label: '', cls: 'day blank', off: true, aria: '', pick: null });
    for (var d = 1; d <= count; d++) {
      (function (d) {
        var dt = new Date(s.y, s.m, d);
        var off = dt < today;
        var key = s.y + '/' + s.m + '/' + d;
        var sel = s.picked && s.picked.key === key;
        days.push({ label: String(d), off: off, cls: off ? 'day off' : (sel ? 'day sel' : 'day'), aria: DAYS[dt.getDay()] + ' ' + d + ' ' + MONTHS[s.m] + (off ? ', unavailable' : ''),
          pick: function () { if (!off) self.setState({ picked: { key: key, label: DAYS[dt.getDay()] + ' ' + d + ' ' + MONTHS[s.m] + ' ' + s.y }, error: '' }); } });
      })(d);
    }
    var nowM = new Date();
    var prevOff = s.y < nowM.getFullYear() || (s.y === nowM.getFullYear() && s.m <= nowM.getMonth());

    var WANTS = ['Bridal bouquet','Bridesmaids','Buttonholes','Corsages','Not sure yet'];
    var wants = WANTS.map(function (w) { var on = !!s.wants[w]; return { label: w, on: on, cls: on ? 'chip on' : 'chip', pick: function () { var n = Object.assign({}, self.state.wants); n[w] = !n[w]; self.setState({ wants: n }); } }; });
    var handover = ['Collection','Delivery'].map(function (h) { var on = s.handover === h; return { label: h, on: on, cls: on ? 'chip on' : 'chip', pick: function () { self.setState({ handover: on ? '' : h }); } }; });

    var FAQ = [
      { q: 'How far ahead should I book?', a: 'We take a limited number of weddings each season, so we suggest enquiring as soon as you have your date. Dates for 2026 are filling now.' },
      { q: 'Can you match my outfit colours?', a: 'Yes. Share photos of your outfit and any inspiration during your consultation and we will design around your palette.' },
      { q: 'Do you deliver?', a: 'Choose collection or delivery when you enquire and we will confirm the details for your venue with your quote.' },
      { q: 'How do I lock in my date?', a: 'After your consultation we send a quote. A deposit secures your date, and our full terms and refund policy come with it.' }
    ];
    var faqs = FAQ.map(function (f, i) { var open = s.open === i; return { q: f.q, a: f.a, open: open, plusCls: open ? 'plus open' : 'plus', toggle: function () { self.setState({ open: open ? -1 : i }); } }; });

    return {
      tabs: tabs, items: MENU[s.tab], tabImg: IMG[s.tab], tabAlt: ALT[s.tab], tabKey: s.tab,
      weekdays: ['S','M','T','W','T','F','S'], days: days, monthLabel: MONTHS[s.m] + ' ' + s.y, prevOff: prevOff,
      prev: function () { if (prevOff) return; var m = s.m - 1, y = s.y; if (m < 0) { m = 11; y--; } self.setState({ m: m, y: y }); },
      next: function () { var m = s.m + 1, y = s.y; if (m > 11) { m = 0; y++; } self.setState({ m: m, y: y }); },
      pickedLabel: s.picked ? s.picked.label : 'Select your wedding date on the calendar',
      wants: wants, handover: handover, maids: s.maids,
      less: function () { self.setState({ maids: Math.max(0, self.state.maids - 1) }); },
      more: function () { self.setState({ maids: Math.min(20, self.state.maids + 1) }); },
      faqs: faqs, error: s.error, sent: s.sent, notSent: !s.sent, firstName: s.firstName,
      submit: function (e) {
        if (e && e.preventDefault) e.preventDefault();
        var fd = new FormData(e.target);
        var name = String(fd.get('name') || '').trim(), email = String(fd.get('email') || '').trim();
        if (!self.state.picked) return self.setState({ error: 'Please choose your wedding date on the calendar.' });
        if (!name) return self.setState({ error: 'Please add your name.' });
        if (!/^\S+@\S+\.\S+$/.test(email)) return self.setState({ error: 'Please add a valid email so we can reply.' });
        self.setState({ sent: true, error: '', firstName: name.split(' ')[0] });
      },
      reset: function () { self.setState({ sent: false, picked: null, wants: {}, maids: 0, handover: '', firstName: '' }); }
    };
  }

  var s = this.state;

    date: s.picked ? s.picked.label : '',
    looking_for: Object.keys(s.wants || {}).filter(function (k) { return s.wants[k]; }).join(', '),
    bridesmaids: String(s.maids || 0),
    on_the_day: s.handover || ''
  };
};
